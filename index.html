<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="月次報告">
<meta name="theme-color" content="#0f2f5e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>北洋牧場 月次報告</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--navy:#0f2f5e;--navy2:#1b4585;--orange:#f97316;--bg:#f3f4f6;--line:#e5e7eb;--text:#111827;--mute:#6b7280;--ok:#065f46;--warn:#92400e;--err:#b91c1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto}
header.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.bar .row{display:flex;align-items:center;gap:10px}
.bar h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{font-size:12px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:34px;height:34px;border-radius:8px;background:#fff;color:var(--orange);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.back{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:8px;padding:8px 12px;font-size:15px;flex:none}
.chip{border:none;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.2);flex:none}
.chip.pend{background:var(--orange)}
.chip.err{background:var(--err)}
.notice{font-size:13px;line-height:1.7;padding:10px 14px;color:#fff}
.notice.err{background:var(--err)}
.notice.warn{background:var(--warn)}
.notice button{margin-top:6px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:6px 12px;font-size:13px}
.tools{background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;position:sticky;z-index:15}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;border-radius:8px;padding:9px 4px;font-size:14px;font-weight:600;color:var(--mute);white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.modes{margin-bottom:8px;background:#e8edf5}
.seg.modes button.on{background:var(--navy);color:#fff}
.search{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.month{font-size:12px;color:var(--mute);margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.month .nav{display:flex;align-items:center;gap:6px}
.month .nav button{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:28px;font-size:16px;line-height:1;color:var(--navy)}
.month .nav b{font-size:13px;color:var(--text)}
.grp{padding:14px 14px 4px;font-size:13px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between}
.grp span{font-weight:500;color:var(--mute)}
.list{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.horse{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--line);padding:14px;min-height:64px}
.horse:last-child{border-bottom:none}
.horse:active{background:#eef2f7}
.horse .nm{font-weight:700;font-size:17px;flex:1;min-width:0}
.horse .nm small{display:block;font-weight:400;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px;flex:none}
.b-f{background:#d1fae5;color:#065f46}.b-y{background:#dbeafe;color:#1e40af}.b-b{background:#fce7f3;color:#9d174d}.b-e{background:#e5e7eb;color:#374151}
.cnt{flex:none;text-align:right;font-size:13px;color:var(--mute);min-width:74px}
.cnt b{display:block;font-size:15px;color:var(--text)}
.cnt .sel{color:var(--orange);font-weight:700}
.cnt.none b{color:#9ca3af;font-weight:500;font-size:13px}
.empty{padding:40px 20px;text-align:center;color:var(--mute);font-size:14px;line-height:1.8}
.shoot{padding:14px;display:flex;gap:10px;background:#fff;border-bottom:1px solid var(--line)}
.btn{border:none;border-radius:12px;padding:16px 10px;font-size:17px;font-weight:700}
.btn.main{flex:2;background:var(--orange);color:#fff}
.btn.sub{flex:1;background:#fff;color:var(--navy);border:1.5px solid var(--navy);font-size:14px}
.btn:active{opacity:.8}
.mh{padding:14px 14px 6px;font-size:14px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between;align-items:baseline}
.mh span{font-size:12px;font-weight:500;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 4px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.ph{position:relative;aspect-ratio:1/1;background:#d1d5db;overflow:hidden;border-radius:4px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.on{outline:4px solid var(--orange);outline-offset:-4px}
.ph .o{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px}
.ph .d{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:4px;padding:1px 6px}
.ph .w{position:absolute;left:5px;top:5px;background:var(--warn);color:#fff;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px}
.ph .star{position:absolute;right:0;top:0;width:46px;height:46px;border:none;background:none;display:flex;align-items:flex-start;justify-content:flex-end;padding:5px}
.ph .star i{width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);color:transparent;font-style:normal;font-size:16px;line-height:24px;text-align:center;font-weight:800}
.ph.on .star i{background:var(--orange);color:#fff}
.hint{font-size:12px;color:var(--mute);padding:10px 14px 0;line-height:1.7}
.seg.htab{margin:12px 14px 0}
.gsum{padding:14px 14px 0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.gsum b{font-size:26px;color:var(--navy)}
.gsum span{font-size:12px;color:var(--mute)}
.gsum .gain{font-weight:700;color:#8a6d1f}
.gch{padding:6px 10px 0}
.grow{border-top:1px solid var(--line);padding:12px 14px}
.gm{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--navy)}
.gm b{font-size:17px}
.gm .diff{font-size:12px;font-weight:700;color:var(--mute)}
.gm .diff.up{color:var(--ok)}.gm .diff.down{color:var(--err)}
.gev{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
.gev i{font-style:normal;font-size:11px;font-weight:700;background:#e8edf5;color:var(--navy);border-radius:999px;padding:3px 9px}
.gc{margin-top:6px;font-size:13px;line-height:1.7;color:var(--text)}
.gp{margin-top:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.gp img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:4px;background:#d1d5db;display:block}
#viewer{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
#viewer .top{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;font-size:13px;gap:10px}
#viewer .img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#viewer .img img{max-width:100%;max-height:100%;object-fit:contain}
#viewer .bot{display:flex;gap:10px;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px)}
#viewer .bot button{flex:1;border-radius:12px;border:1.5px solid #fff;background:none;color:#fff;padding:13px 6px;font-size:15px;font-weight:700}
#viewer .bot button.on{background:var(--orange);border-color:var(--orange)}
#viewer .bot button.del{flex:none;width:84px;border-color:#f87171;color:#fca5a5}
#viewer .x{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;padding:8px 14px;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#login form{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
#login label{display:block;font-size:13px;font-weight:600;color:#374151;margin:12px 0 4px}
#login input{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:11px 12px}
#login .go{width:100%;margin-top:18px;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:13px;font-weight:700}
#login .go:disabled{background:#9ca3af}
#login .e{color:var(--err);font-size:13px;margin:10px 0 0}
#login .lnk{margin-top:12px;background:none;border:none;color:var(--navy2);font-size:13px;padding:0}
.panel{background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;font-size:13px;line-height:1.9;color:#374151}
.panel button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;margin:6px 8px 0 0}
/* ---- 報告の入力（馬の画面） ---- */
.form{background:#fff;border-bottom:1px solid var(--line);padding:12px 14px}
.form .fr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.form label.lb{font-size:13px;font-weight:700;color:var(--navy);flex:none;width:52px}
.form input.wt{width:110px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;text-align:right}
.form .diff{font-size:13px;font-weight:700}
.form .diff.up{color:var(--ok)}.form .diff.down{color:var(--err)}
.form .prev{font-size:12px;color:var(--mute)}
.evs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ev{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;color:#374151}
.ev.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.cm{width:100%;min-height:76px;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.phr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.phr button{border:1px dashed #c7d2e4;background:#f7f9fc;border-radius:8px;padding:6px 10px;font-size:12px;color:var(--navy2);text-align:left}
.skipbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;font-size:13px;color:var(--mute)}
.skipbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px}
/* ---- 報告（オーナー一覧・作成） ---- */
.own{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--line);padding:14px;min-height:64px}
.own:last-child{border-bottom:none}
.own .nm{font-weight:700;font-size:16px;flex:1;min-width:0}
.own .nm small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.own .st{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:#e5e7eb;color:#374151}
.own .st.done{background:#d1fae5;color:#065f46}
.cmp{padding:14px}
.cmp .txt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;font-size:14px;line-height:1.9}
.cmp h3{font-size:13px;color:var(--navy);margin:16px 0 6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts button{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:11px;padding:13px 8px;font-size:14px;font-weight:700}
.acts button.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.acts button.wide{grid-column:1/-1}
.acts button.done{background:var(--ok);border-color:var(--ok);color:#fff}
/* ---- シート（体重取り込み） ---- */
.sheet{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheet .in{background:#fff;width:100%;max-height:92vh;display:flex;flex-direction:column;border-radius:16px 16px 0 0}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid var(--line)}
.sheet .sh h2{font-size:16px;margin:0}
.sheet .sb{padding:14px;overflow:auto;flex:1}
.sheet .sf{padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);display:flex;gap:10px}
.sheet .sf button{flex:1;border-radius:11px;padding:13px;font-size:15px;font-weight:700;border:1.5px solid var(--navy);background:#fff;color:var(--navy)}
.sheet .sf button.pri{background:var(--navy);color:#fff}
.sheet .sf button:disabled{opacity:.45}
.note{font-size:12px;color:var(--mute);line-height:1.8;background:#f7f9fc;border-radius:10px;padding:10px}
.ta{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.drow{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.drow .n{flex:1;min-width:0;font-weight:600}
.drow .s{color:var(--mute);font-size:12px}
.drow .w{font-weight:700}
.wline{font-size:13px;color:var(--navy);font-weight:700;margin-bottom:6px}
</style>
</head>
<body>

<div id="boot" class="empty">読み込み中…</div>

<div id="login" hidden>
  <form id="loginForm">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
      <div class="logo" style="background:var(--navy)">北</div>
      <div><div style="font-weight:700;font-size:17px">北洋牧場 月次報告</div><div style="font-size:12px;color:var(--mute)">カルテ・牧場管理と同じアカウントでログイン</div></div>
    </div>
    <label for="em">メールアドレス</label><input id="em" type="email" autocomplete="username">
    <label for="pw">パスワード</label><input id="pw" type="password" autocomplete="current-password">
    <p class="e" id="loginErr" hidden></p>
    <button class="go" id="loginBtn" type="submit">ログイン</button>
    <button class="lnk" id="resetBtn" type="button">パスワードを忘れた場合</button>
  </form>
</div>

<div id="app" hidden>
  <header class="bar" id="bar">
    <div class="wrap">
      <div class="row">
        <button class="back" id="backBtn" hidden>‹ 戻る</button>
        <div class="logo" id="logo">北</div>
        <div style="flex:1;min-width:0"><h1 id="title">月次報告</h1><div class="sub" id="subtitle"></div></div>
        <button class="chip" id="syncChip">保存済み</button>
      </div>
    </div>
  </header>
  <div id="notice"></div>
  <div id="panel" class="panel" hidden></div>

  <main class="wrap">
    <section id="home">
      <div class="tools" id="tools">
        <div class="seg modes" id="modeSeg">
          <button data-m="photo">写真を撮る</button>
          <button data-m="report">報告を作る</button>
        </div>
        <div class="seg" id="seg">
          <button data-f="foal">当歳</button>
          <button data-f="yearling">一才</button>
          <button data-f="mare">繁殖</button>
          <button data-f="all">全頭</button>
          <button data-f="left">退厩</button>
        </div>
        <input class="search" id="q" type="search" placeholder="馬名・オーナーで探す" autocomplete="off">
        <div class="month">
          <span class="nav"><button id="ymPrev" aria-label="前の月">‹</button><b id="monthLabel"></b><button id="ymNext" aria-label="次の月">›</button></span>
          <span id="monthStat"></span>
        </div>
      </div>
      <div id="list"></div>
    </section>

    <section id="horse" hidden>
      <div class="shoot">
        <button class="btn main" id="shootBtn">📷 撮る</button>
        <button class="btn sub" id="pickBtn">アルバムから</button>
      </div>
      <div class="skipbar" id="skipBar"></div>
      <div class="form" id="form"></div>
      <div class="seg htab" id="hTab"><button data-t="photo">今月の作業</button><button data-t="growth">成長記録</button></div>
      <div class="hint" id="selHint">報告に使う写真は右上の ○ をタップして選びます。</div>
      <div id="photos"></div>
      <div id="growth" hidden></div>
    </section>

    <section id="compose" hidden><div class="cmp" id="cmpBody"></div></section>
  </main>
</div>

<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="lib" type="file" accept="image/*" multiple hidden>

<div id="viewer" hidden>
  <div class="top"><span id="vInfo" style="flex:1;min-width:0"></span><label style="display:flex;align-items:center;gap:6px;flex:none">撮影日<input id="vDate" type="date" style="border:none;border-radius:8px;padding:6px 8px;font-size:14px;background:#fff;color:#111"></label><button class="x" id="vClose">閉じる</button></div>
  <div class="img"><img id="vImg" alt=""></div>
  <div class="bot"><button id="vSel">報告に使う</button><button class="del" id="vDel">削除</button></div>
</div>

<div id="wi" class="sheet" hidden><div class="in">
  <div class="sh"><h2>体重をまとめて取り込む</h2><button class="back" style="background:var(--bg);color:var(--text)" id="wiClose">閉じる</button></div>
  <div class="sb">
    <div class="note">スプレッドシートの表をそのまま貼り付けてください。次の形に対応しています。<br>
    ① 1行目が月（4月／2026-04 など）、2行目から「馬名 体重 体重 …」<br>
    ② 1行ずつ「馬名, 2026-06, 320」<br>
    ③ 1行目が月齢（0ヶ月 1ヶ月 …）。生年月日の列があれば自動で月に換算します。<br>
    年が無い月は、上で選んでいる年として扱います。馬名は登録名と部分一致で照合します。</div>
    <textarea id="wiText" class="ta" placeholder="トモノメジェール2026	215	233	245"></textarea>
    <div id="wiPreview" style="margin-top:10px"></div>
  </div>
  <div class="sf"><button id="wiCheck">内容を確認</button><button class="pri" id="wiApply" disabled>取り込む</button></div>
</div></div>

<div id="toast" hidden></div>

<script>
"use strict";
/* =====================================================================
   北洋牧場 月次報告アプリ
   ・Firebase プロジェクト hokuyo-emr に相乗り（ログインはカルテ／牧場管理と共通）
   ・馬とオーナーは牧場管理アプリの farm_data/horses を「読むだけ」（書き込みはしない）
   ・写真本体は Firebase Storage（farm_photos/馬ID/…）、写真の情報は Firestore（farm_photos）
   ・体重・出来事・コメント・送信済みは Firestore（farm_reports）
   ・電波が悪いときは端末内にためておき、つながったら自動で送る
   ===================================================================== */
const APP_VER="2.3", APP_BUILD="2026-10-15";
const FB_CONFIG={apiKey:"AIzaSyCpBn2haBU1zEIepTpCwF8KeL5v_2_Lnzc",authDomain:"hokuyo-emr.firebaseapp.com",projectId:"hokuyo-emr",storageBucket:"hokuyo-emr.firebasestorage.app",messagingSenderId:"687686923750",appId:"1:687686923750:web:34853b887e5873f7fe9227"};
const COL_HORSES="farm_data", DOC_HORSES="horses";   // 牧場管理アプリのデータ（読み取り専用）
const COL_PHOTOS="farm_photos";                      // 写真の情報＋サムネイル
const COL_PHOTO_DATA="farm_photo_data";              // 写真の本体（1枚1件）
const COL_REPORTS="farm_reports";                    // 体重・出来事・コメント・送信済み

function errMsg(e){
  const c=(e&&e.code)||"";const m=(e&&e.message)||String(e);
  if(c==="permission-denied")return "クラウドのルールで拒否されました。farm_photos・farm_photo_data・farm_reports の読み書き許可が必要です。";
  if(c==="unavailable"||/network|offline|failed to fetch/i.test(m))return "ネットワークにつながらず、送信できませんでした。つながったら自動で送り直します。";
  if(c==="resource-exhausted")return "保存容量の上限に達しました。";
  if(c==="invalid-argument"&&/longer than|bytes/i.test(m))return "写真のサイズが大きすぎて保存できませんでした。";
  return m;
}
/* 画像とテキストの相互変換（写真は Firestore に文字列として保存する） */
function blobToB64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]||"");fr.onerror=()=>rej(fr.error||new Error("画像を変換できませんでした"));fr.readAsDataURL(blob)})}
function b64ToBlob(b64){
  const bin=atob(String(b64||""));const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:"image/jpeg"});
}
const b64Url=b=>b?"data:image/jpeg;base64,"+b:"";

/* ---------- 端末内の送信待ち置き場（IndexedDB） ---------- */
let idbP=null;
function idb(){
  if(idbP)return idbP;
  idbP=new Promise((res,rej)=>{
    const r=indexedDB.open("hokuyo_report",1);
    r.onupgradeneeded=()=>{r.result.createObjectStore("queue",{keyPath:"id"})};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  return idbP;
}
function qTx(mode,fn){
  return idb().then(db=>new Promise((res,rej)=>{
    const tx=db.transaction("queue",mode);const st=tx.objectStore("queue");
    const rq=fn(st);
    tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);
  }));
}
const qPut=rec=>qTx("readwrite",st=>st.put(rec));
const qGet=id=>qTx("readonly",st=>st.get(id));
const qDel=id=>qTx("readwrite",st=>st.delete(id));
const qAll=()=>qTx("readonly",st=>st.getAll());
function metaOf(rec){
  if(!thumbUrls.has(rec.id)&&rec.thumbB64)thumbUrls.set(rec.id,URL.createObjectURL(b64ToBlob(rec.thumbB64)));
  return{id:rec.id,horseId:rec.horseId,horseName:rec.horseName,owner:rec.owner,cat:rec.cat,takenAt:rec.takenAt,ym:rec.ym,w:rec.w,h:rec.h,orient:rec.orient,selected:!!rec.selected,thumbUrl:thumbUrls.get(rec.id),queued:true};
}
/* 写真の表示元（送信待ちは端末内、送信済みは Firestore のサムネイル） */
function thumbSrc(p){return p.queued?p.thumbUrl:(p.thumbB64?b64Url(p.thumbB64):(p.thumbUrl||""))}
function dropThumb(id){const u=thumbUrls.get(id);if(u){URL.revokeObjectURL(u);thumbUrls.delete(id)}}
async function loadQueue(){
  try{
    const all=await qAll();const out=[];
    for(const rec of (all||[])){

    }
    S.queue=out;
  }catch(e){console.warn("queue",e);S.queue=[]}
}

/* ---------- 画像の縮小 ---------- */
function loadImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>{res({im,url})};
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("この画像は読み込めませんでした"))};
    im.src=url;
  });
}
function drawTo(im,edge,q){
  const W=im.naturalWidth,H=im.naturalHeight;const k=Math.min(1,edge/Math.max(W,H));
  const w=Math.max(1,Math.round(W*k)),h=Math.max(1,Math.round(H*k));
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;
  const cx=cv.getContext("2d");cx.imageSmoothingQuality="high";cx.drawImage(im,0,0,w,h);
  return new Promise((res,rej)=>cv.toBlob(b=>{cv.width=cv.height=0;b?res({blob:b,w,h}):rej(new Error("画像を変換できませんでした"))},"image/jpeg",q));
}
async function shrink(file){
  const{im,url}=await loadImage(file);
  try{
    let edge=LONG_EDGE,q=JPEG_Q;
    let big=await drawTo(im,edge,q);
    let b64=await blobToB64(big.blob);
    /* 1件の上限に収まるまで少しずつ小さくする */
    let guard=0;
    while(b64.length>MAX_B64&&guard++<8&&(q>0.5||edge>900)){
      if(q>0.5)q=Math.max(0.5,q-0.12);else edge=Math.round(edge*0.85);
      big=await drawTo(im,edge,q);b64=await blobToB64(big.blob);
    }
    if(b64.length>MAX_B64)throw new Error("この写真は大きすぎて保存できませんでした。");
    const th=await drawTo(im,THUMB_EDGE,THUMB_Q);
    const thumbB64=await blobToB64(th.blob);
    return{b64,thumbB64,w:big.w,h:big.h};
  }finally{URL.revokeObjectURL(url)}
}
/* ---------- 前の版で端末に残った写真を新しい形式に直す ---------- */
function bufToB64(buf){
  const u=new Uint8Array(buf);let s="";
  for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
  return btoa(s);
}
async function fitB64(b64){
  if(!b64||b64.length<=MAX_B64)return b64;
  const{im,url}=await loadImage(b64ToBlob(b64));
  try{
    let edge=LONG_EDGE,q=JPEG_Q,guard=0;
    let out=await blobToB64((await drawTo(im,edge,q)).blob);
    while(out.length>MAX_B64&&guard++<8&&(q>0.5||edge>900)){
      if(q>0.5)q=Math.max(0.5,q-0.12);else edge=Math.round(edge*0.85);
      out=await blobToB64((await drawTo(im,edge,q)).blob);
    }
    if(out.length>MAX_B64)throw new Error("この写真は大きすぎて保存できませんでした。");
    return out;
  }finally{URL.revokeObjectURL(url)}
}
async function thumbFromB64(b64){
  const{im,url}=await loadImage(b64ToBlob(b64));
  try{return await blobToB64((await drawTo(im,THUMB_EDGE,THUMB_Q)).blob)}
  finally{URL.revokeObjectURL(url)}
}
async function migrateRec(rec){
  if(!rec)return rec;
  let ch=false;
  if(!rec.b64&&rec.buf){rec.b64=await fitB64(bufToB64(rec.buf));delete rec.buf;ch=true}
  if(!rec.thumbB64&&rec.thumb){rec.thumbB64=bufToB64(rec.thumb);delete rec.thumb;ch=true}
  if(!rec.thumbB64&&rec.b64){rec.thumbB64=await thumbFromB64(rec.b64);ch=true}
  if(ch)try{await qPut(rec)}catch(e){console.warn("migrate",e)}
  return rec;
}
async function exifDate(file){
  try{
    const u=new Uint8Array(await file.slice(0,1048576).arrayBuffer());const v=new DataView(u.buffer);
    const N=u.length;
    for(let i=0;i+20<N;i++){
      if(u[i]!==0x45||u[i+1]!==0x78||u[i+2]!==0x69||u[i+3]!==0x66||u[i+4]!==0||u[i+5]!==0)continue;
      const t=i+6;const le=u[t]===0x49&&u[t+1]===0x49,be=u[t]===0x4D&&u[t+1]===0x4D;
      if(!le&&!be)continue;
      if(v.getUint16(t+2,le)!==42)continue;
      const u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le);
      const str=(p,n)=>{let x="";for(let k=0;k<n&&p+k<N;k++){const c=u[p+k];if(!c)break;x+=String.fromCharCode(c)}return x};
      const scan=(ifd,tags)=>{const out={};if(ifd+2>N)return out;const n=u16(ifd);
        for(let k=0;k<n;k++){const e=ifd+2+k*12;if(e+12>N)break;const tag=u16(e);if(tags.includes(tag))out[tag]={cnt:u32(e+4),val:u32(e+8)}}return out};
      const a=scan(t+u32(t+4),[0x8769,0x0132]);let ds=null;
      if(a[0x8769]){const b=scan(t+a[0x8769].val,[0x9003,0x9004]);const d=b[0x9003]||b[0x9004];if(d)ds=str(t+d.val,d.cnt)}
      if(!ds&&a[0x0132])ds=str(t+a[0x0132].val,a[0x0132].cnt);
      const m=ds&&ds.match(/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
      if(!m||m[1]==="0000")continue;
      const d=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime();
      if(!isNaN(d)&&d<=Date.now()+86400000)return d;
    }
  }catch(e){console.warn("exif",e)}
  return null;
}
function orientOf(w,h){const r=w/h;return r>1.1?"横":r<0.9?"縦":"正方"}

/* ---------- 馬の一覧（牧場管理のデータを読むだけ） ---------- */
function isActive(h){return !h.exit||String(h.exit)>=todayStr()}
function inMonth(h,ym){return !h.exit||String(h.exit).slice(0,7)>=ym}
function ownerLabel(h){
  if(h.isShared)return "北洋牧場（共有"+(h.coOwner?"："+h.coOwner:"")+"）";
  if(h.selfOwned)return "北洋牧場（自己所有）";
  return h.owner||"（オーナー未設定）";
}
function isSelfOwner(k){return k.indexOf("北洋牧場")===0}
function ownerRank(h){return h.isShared?1:h.selfOwned?2:0}
function catClass(c){return c==="当歳"?"b-f":c==="一才"?"b-y":c==="繁殖"?"b-b":"b-e"}
const CAT_ORD={"当歳":0,"一才":1,"育成":2,"繁殖":3};
function horseById(id){return S.horses.find(h=>String(h.id)===String(id))}
function birthYear(h){
  let m=String(h.birthDate||"").match(/^(\d{4})/);if(m)return +m[1];
  m=String(h.name||"").match(/(20\d{2})/);return m?+m[1]:null;
}
function autoCat(h){
  if(h.cat==="繁殖")return h.cat;
  const by=birthYear(h);if(!by)return h.cat||"";
  const base=(h.exit&&String(h.exit)<todayStr()&&/^\d{4}/.test(h.exit))?+String(h.exit).slice(0,4):new Date().getFullYear();
  const a=base-by;
  return a<0?(h.cat||""):a===0?"当歳":a===1?"一才":"育成";
}
/* その月の時点での区分（過去月の報告でも当時の区分で出す） */
function catAt(h,ym){
  if(h.cat==="繁殖"||h.catReg==="繁殖")return "繁殖";
  const by=birthYear(h);if(by===null)return h.cat||"";
  const a=Number(String(ym).slice(0,4))-by;
  return a<0?(h.cat||""):a===0?"当歳":a===1?"一才":"育成";
}
function ageLabel(h,ym){
  if(!h.birthDate)return "";
  const b=new Date(h.birthDate);if(isNaN(b))return "";
  const[y,m]=String(ym).split("-").map(Number);
  const a=(y-b.getFullYear())*12+(m-1-b.getMonth());
  return a<0||a>=24?"":"生後"+a+"か月";
}
function setHorses(arr,from){
  S.horses=(Array.isArray(arr)?arr:[]).filter(h=>h&&h.id!=null&&h.name).map(h=>({...h,catReg:h.cat,cat:autoCat(h)}));S.horsesFrom=from;S.horsesYear=new Date().getFullYear();
}

/* ---------- 月次の記録（体重・出来事・コメント） ---------- */
function repId(ym,hid){return ym+"__"+hid}
function blankRep(hid,ym){
  const h=horseById(hid);
  /* 繁殖は既定では報告に含めない。ただしその月に退厩した馬は必ず載せる */
  const left=!!(h&&h.exit&&String(h.exit).slice(0,7)===ym);
  return{ym,horseId:String(hid),weight:"",events:[],comment:"",skip:!!h&&catAt(h,ym)==="繁殖"&&!left};
}
function repOf(hid){return S.repMonth[String(hid)]||blankRep(hid,S.ym)}
async function saveRep(hid,patch){
  const cur=repOf(hid);const next={...cur,...patch,ym:S.ym,horseId:String(hid)};
  S.repMonth[String(hid)]=next;
  try{
    await fbDb.collection(COL_REPORTS).doc(repId(S.ym,hid)).set({
      ym:next.ym,horseId:next.horseId,weight:String(next.weight||""),events:next.events||[],
      comment:next.comment||"",skip:!!next.skip,at:Date.now(),by:(S.user&&S.user.email)||""
    },{merge:true});
  }catch(e){console.error(e);toast(errMsg(e))}
}
function lastWeight(hid){
  const arr=S.repHorse.filter(r=>r.ym<S.ym&&r.weight).sort((a,b)=>a.ym<b.ym?1:-1);

}

/* ---------- 撮影 → 縮小 → 端末に保存 → 送信 ---------- */
async function addFiles(files,fromCamera){
  const h=horseById(S.horseId);if(!h||!files||!files.length)return;
  let ok=0,last="",noDate=0;
  for(const f of Array.from(files)){
    try{
      toast("保存中…",0);
      const r=await shrink(f);
      let takenAt=Date.now();
      if(!fromCamera){
        const ex=await exifDate(f);
        if(ex)takenAt=ex;
        else{noDate++;if(f.lastModified&&Date.now()-f.lastModified>3600000)takenAt=f.lastModified}
      }
      const id=takenAt+"_"+Math.random().toString(36).slice(2,8);
      const rec={id,horseId:String(h.id),horseName:h.name,owner:ownerLabel(h),cat:h.cat||"",takenAt,ym:ymOf(takenAt),w:r.w,h:r.h,orient:orientOf(r.w,r.h),selected:false,b64:r.b64,thumbB64:r.thumbB64};
      await qPut(rec);
      S.queue.push(metaOf(rec));ok++;last=rec.orient;
      renderHorse();renderSync();
    }catch(e){console.error(e);toast(e.message||"保存できませんでした");}
  }
  if(ok)toast(noDate?"撮影日が記録されていない写真が "+noDate+" 枚ありました。仮の日付で保存したので、写真を開いて「撮影日」を確認してください。":ok===1?"保存しました（"+last+"）":ok+"枚 保存しました",noDate?6000:undefined);
  pump();
}
async function pump(){
  if(S.uploading||!S.user||!fbDb||!navigator.onLine)return;
  S.uploading=true;S.upErr=null;renderSync();
  try{
    const ids=S.queue.slice().sort((a,b)=>a.takenAt-b.takenAt).map(x=>x.id);
    for(const id of ids){
      const rec=await migrateRec(await qGet(id));
      if(!rec){S.queue=S.queue.filter(x=>x.id!==id);continue}
      if(!rec.b64||!rec.thumbB64){S.upErr="この写真は前の版の形式で、画像を読み出せませんでした。お手数ですが撮り直してください。";continue}
      const cur=(await qGet(id))||rec;
      const b=fbDb.batch();
      b.set(fbDb.collection(COL_PHOTOS).doc(rec.id),{
        horseId:rec.horseId,horseName:rec.horseName,owner:rec.owner,cat:rec.cat,takenAt:rec.takenAt,ym:rec.ym,
        w:rec.w,h:rec.h,orient:rec.orient,selected:!!cur.selected,thumbB64:rec.thumbB64,
        by:(S.user&&S.user.email)||"",at:Date.now()
      });
      b.set(fbDb.collection(COL_PHOTO_DATA).doc(rec.id),{horseId:rec.horseId,ym:rec.ym,b64:rec.b64,at:Date.now()});
      await b.commit();
      await qDel(id);dropThumb(id);
      S.queue=S.queue.filter(x=>x.id!==id);
      render();
    }

async function toggleSel(id){
  const p=findPhoto(id);if(!p)return;const v=!p.selected;
  try{
    if(p.queued){const rec=await qGet(id);if(rec){rec.selected=v;await qPut(rec)}p.selected=v;render()}
    else{p.selected=v;render();await fbDb.collection(COL_PHOTOS).doc(id).update({selected:v})}

async function changeDate(id,ds){
  const p=findPhoto(id);const m=ds&&ds.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!p||!m)return;
  const o=new Date(p.takenAt);
  const t=new Date(+m[1],+m[2]-1,+m[3],o.getHours(),o.getMinutes(),o.getSeconds()).getTime();
  if(isNaN(t)||t===p.takenAt)return;
  try{
    if(p.queued){const rec=await qGet(id);if(rec){rec.takenAt=t;rec.ym=ymOf(t);await qPut(rec)}p.takenAt=t;p.ym=ymOf(t)}

}
async function delPhoto(id){
  const p=findPhoto(id);if(!p)return;
  if(!confirm("この写真を削除しますか？\n（元に戻せません）"))return;
  try{
    if(p.queued){await qDel(id);dropThumb(id);S.queue=S.queue.filter(x=>x.id!==id)}
    else{

      b.delete(fbDb.collection(COL_PHOTOS).doc(id));

function monthPhotosAll(){return S.monthPhotos.concat(S.queue.filter(p=>p.ym===S.ym))}
function selectedOf(hid){return monthPhotosAll().filter(p=>String(p.horseId)===String(hid)&&p.selected).sort((a,b)=>a.takenAt-b.takenAt)}
function ownerHorses(k){
  return S.horses.filter(h=>ownerLabel(h)===k&&inMonth(h,S.ym))
    .sort((a,b)=>((CAT_ORD[catAt(a,S.ym)]??9)-(CAT_ORD[catAt(b,S.ym)]??9))||String(a.name).localeCompare(String(b.name),"ja"));

function ownerKeys(){
  const set=new Map();
  S.horses.filter(h=>inMonth(h,S.ym)).forEach(h=>{const k=ownerLabel(h);if(!set.has(k))set.set(k,ownerRank(h))});

function hasContent(h){
  const r=repOf(h.id);
  if(r.skip)return false;
  return !!(r.weight||((r.events||[]).length)||r.comment||selectedOf(h.id).length||(h.exit&&String(h.exit).slice(0,7)===S.ym));
}
function buildText(k){
  const hs=ownerHorses(k).filter(hasContent);
  const lines=[isSelfOwner(k)?k:k+" 様","",ymLabel(S.ym)+"の預託馬の近況をご報告いたします。",""];
  hs.forEach(h=>{
    const r=repOf(h.id);const c=catAt(h,S.ym);const al=ageLabel(h,S.ym);
    lines.push("■ "+h.name+"（"+c+(al?"・"+al:"")+"）");
    if(r.weight){const lw=lastWeight2(h.id);const d=lw?Number(r.weight)-lw.w:null;
      lines.push("体重 "+r.weight+"kg"+(d!==null&&!isNaN(d)?"（前回比 "+(d>=0?"+":"")+d+"kg）":""));}
    if((r.events||[]).length)lines.push(r.events.join("・"));
    if(h.exit&&String(h.exit).slice(0,7)===S.ym)lines.push(Number(String(h.exit).slice(5,7))+"月"+Number(String(h.exit).slice(8,10))+"日 退厩");
    if(r.comment)lines.push(String(r.comment).trim());

}

const prevWeightCache={};
function lastWeight2(hid){

/* ---------- 共有・印刷 ---------- */
async function photoFiles(k){
  const files=[];let failed=0;
  for(const h of ownerHorses(k).filter(hasContent)){
    const ps=selectedOf(h.id);
    for(let i=0;i<ps.length;i++){
      const p=ps[i];const nm=h.name+"_"+(i+1)+".jpg";
      try{
        const b=await fullB64(p);
        if(b)files.push(new File([b64ToBlob(b)],nm,{type:"image/jpeg"}));else failed++;
      }catch(e){console.warn("photo",e);failed++}
    }
  }
  return{files,failed};
}
function copyText(t){
  const fb=()=>{try{prompt("長押しでコピーしてください",t)}catch(e){}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast("文章をコピーしました。LINEで長押し→ペースト"),fb);
  else{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("文章をコピーしました")}catch(e){fb()}ta.remove()}
}

function growthRows(){
  const ps=horsePhotosAll();
  const wmap={},cmap={},emap={};
  S.repHorse.forEach(r=>{
    if(r.weight)wmap[r.ym]=Number(r.weight);
    if(r.comment)cmap[r.ym]=r.comment;
    if((r.events||[]).length)emap[r.ym]=r.events;
  });
  const keys=new Set();
  ps.forEach(p=>keys.add(p.ym));
  [wmap,cmap,emap].forEach(m=>Object.keys(m).forEach(k=>keys.add(k)));
  let prev=null;
  return [...keys].sort().map(ym=>{
    const w=wmap[ym]!=null&&!isNaN(wmap[ym])?wmap[ym]:null;
    const d=(w!=null&&prev!=null)?w-prev:null;
    if(w!=null)prev=w;
    const pl=ps.filter(p=>p.ym===ym).sort((a,b)=>a.takenAt-b.takenAt);
    const sel=pl.filter(p=>p.selected);
    return{ym,w,d,photos:sel.length?sel:pl,comment:cmap[ym]||"",events:emap[ym]||[]};
  });
}
function weightChart(rows){
  const pts=rows.filter(r=>r.w!=null);
  if(!pts.length)return "";
  const W=340,H=160,L=40,R=10,T=14,B=26;
  const ws=pts.map(p=>p.w);
  let min=Math.min.apply(null,ws),max=Math.max.apply(null,ws);
  if(max-min<10){const c=(max+min)/2;min=c-5;max=c+5}
  const sp=(max-min)*0.12;min-=sp;max+=sp;
  const x=i=>pts.length<2?L+(W-L-R)/2:L+(W-L-R)*i/(pts.length-1);
  const y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  [0,0.5,1].forEach(t=>{
    const yy=T+(H-T-B)*t;
    s+='<line x1="'+L+'" y1="'+yy.toFixed(1)+'" x2="'+(W-R)+'" y2="'+yy.toFixed(1)+'" stroke="#e5e7eb" stroke-width="1"/>'+
       '<text x="'+(L-6)+'" y="'+(yy+3.5).toFixed(1)+'" text-anchor="end" font-size="9" fill="#9ca3af">'+Math.round(max-(max-min)*t)+"</text>";
  });
  if(pts.length>1)s+='<path d="'+pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.w).toFixed(1)).join(" ")+'" fill="none" stroke="#0f2f5e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  const step=Math.max(1,Math.ceil(pts.length/6));
  pts.forEach((p,i)=>{
    s+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.w).toFixed(1)+'" r="3.2" fill="#c08a2e"/>';
    if(i%step===0||i===pts.length-1)
      s+='<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="#9ca3af">'+Number(p.ym.slice(5,7))+"月</text>";
  });
  return s+"</svg>";
}

function normName(n){return String(n).replace(/[\s　]/g,"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/^[#＃]?\d+[\.．]?/,"")}
function findHorseByName(n){
  const q=normName(n);if(!q)return null;let exact=null,part=null;
  S.horses.forEach(h=>{
    const hn=normName(h.name);
    if(hn===q){if(!exact)exact=h}
    else if(!part&&(hn.indexOf(q)>=0||q.indexOf(hn)>=0)&&Math.min(hn.length,q.length)>=4&&(/\d{4}$/.test(hn)===/\d{4}$/.test(q)))part=h;
  });
  return exact||part;
}
function parseMonth(t,defYear){
  t=String(t).trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  let m=t.match(/(\d{4})[\/\-年\.](\d{1,2})/);if(m)return m[1]+"-"+pad(+m[2]);
  m=t.match(/^(\d{1,2})\s*月?$/)||t.match(/(\d{1,2})月/);if(m&&+m[1]>=1&&+m[1]<=12)return defYear+"-"+pad(+m[1]);
  m=t.match(/^(\d{2})[\/\-\.](\d{1,2})$/);if(m)return "20"+m[1]+"-"+pad(+m[2]);
  return null;
}
function addMonthsTo(dateStr,n){
  const d=new Date(dateStr);if(isNaN(d))return null;
  const y=d.getFullYear(),m=d.getMonth()+n;
  return (y+Math.floor(m/12))+"-"+pad((m%12+12)%12+1);
}
function wiParse(){
  const txt=$("wiText").value.trim();const defYear=String(S.ym).slice(0,4);wiRows=[];const errs=[];
  const lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length){$("wiPreview").innerHTML='<div class="note">貼り付けてから「内容を確認」を押してください。</div>';$("wiApply").disabled=true;return}
  const split=l=>{const a=l.split(/\t|,|、|｜|\|/).map(x=>x.trim()).filter(x=>x!=="");return a.length>1?l.split(/\t|,|、|｜|\|/).map(x=>x.trim()):l.split(/[\s　]+/)};
  const first=split(lines[0]);
  const ageCols=first.map((x,i)=>{const m=String(x).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).match(/^(\d{1,2})\s*[ヶヵかカケ]\s*月/);return m?{i,n:+m[1]}:null}).filter(Boolean);
  const birthCol=first.findIndex(x=>/生年月日|誕生|生年|生まれ/.test(x));
  const headMonths=first.map(x=>parseMonth(x,defYear));
  const isAge=ageCols.length>=2;
  const nHead=headMonths.filter(Boolean).length;
  const isHeader=!isAge&&nHead>=1&&nHead>=first.length-1;
  if(isAge){
    lines.slice(1).forEach(l=>{
      const c=split(l);const name=c[0];if(!name)return;
      const h=findHorseByName(name);if(!h){errs.push("「"+name+"」に一致する馬がありません");return}
      let birth=h.birthDate||"";
      if(birthCol>=0&&c[birthCol]){const d=String(c[birthCol]).replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).match(/(\d{4})[\/\-年\.](\d{1,2})[\/\-月\.](\d{1,2})/);if(d)birth=d[1]+"-"+pad(+d[2])+"-"+pad(+d[3])}
      if(!birth){errs.push("「"+h.name+"」の生年月日が分からないため月齢を月に換算できません");return}
      ageCols.forEach(a=>{
        const w=parseFloat(String(c[a.i]==null?"":c[a.i]).replace(/[^\d.]/g,""));
        const k=addMonthsTo(birth,a.n);
        if(k&&!isNaN(w)&&w>0)wiRows.push({h,ym:k,w:Math.round(w),age:a.n});
      });
    });
  }else if(isHeader){
    const months=headMonths.filter(Boolean);
    lines.slice(1).forEach(l=>{
      const c=split(l);const h=findHorseByName(c[0]);
      if(!h){errs.push("「"+c[0]+"」に一致する馬がありません");return}
      c.slice(1).forEach((v,i)=>{
        const w=parseFloat(String(v).replace(/[^\d.]/g,""));const k=months[i];
        if(k&&!isNaN(w)&&w>0)wiRows.push({h,ym:k,w:Math.round(w)});
      });
    });
  }else{
    lines.forEach(l=>{
      const c=split(l);
      if(c.length<3){errs.push("形が読めません："+l);return}
      const h=findHorseByName(c[0]);const k=parseMonth(c[1],defYear);const w=parseFloat(String(c[2]).replace(/[^\d.]/g,""));
      if(!h){errs.push("「"+c[0]+"」に一致する馬がありません");return}
      if(!k){errs.push("月が読めません："+c[1]);return}
      if(isNaN(w)){errs.push("体重が読めません："+c[2]);return}
      wiRows.push({h,ym:k,w:Math.round(w)});
    });
  }
  let html=wiRows.length?'<div class="wline">'+wiRows.length+"件を取り込みます</div>":"";
  wiRows.forEach(r=>{
    const cur=(r.ym===S.ym&&S.repMonth[String(r.h.id)])?S.repMonth[String(r.h.id)].weight:"";
    html+='<div class="drow"><span class="badge '+catClass(catAt(r.h,r.ym))+'">'+esc(catAt(r.h,r.ym))+'</span><span class="n">'+esc(r.h.name)+'</span><span class="s">'+esc(ymLabel(r.ym))+(r.age!==undefined?"（"+r.age+"か月）":"")+'</span><span class="w">'+r.w+"kg</span>"+(cur&&Number(cur)!==r.w?'<span class="s" style="color:var(--err)">現在 '+esc(cur)+"</span>":"")+"</div>";
  });
  if(errs.length)html+='<div class="note" style="color:var(--err);margin-top:8px">'+errs.map(esc).join("<br>")+"</div>";
  $("wiPreview").innerHTML=html||'<div class="note">読み取れる行がありませんでした。形式をご確認ください。</div>';
  $("wiApply").disabled=!wiRows.length;
}
async function wiApply(){
  if(!wiRows.length)return;
  $("wiApply").disabled=true;toast("取り込んでいます…",0);
  try{
    for(let i=0;i<wiRows.length;i+=400){
      const b=fbDb.batch();
      wiRows.slice(i,i+400).forEach(r=>{
        b.set(fbDb.collection(COL_REPORTS).doc(repId(r.ym,r.h.id)),
          {ym:r.ym,horseId:String(r.h.id),weight:String(r.w),at:Date.now(),by:(S.user&&S.user.email)||""},{merge:true});
      });
      await b.commit();
    }
    closeWI();toast(wiRows.length+"件の体重を取り込みました");
  }catch(e){console.error(e);toast(errMsg(e));$("wiApply").disabled=false}
}
$("wiClose").addEventListener("click",closeWI);
$("wiCheck").addEventListener("click",wiParse);
$("wiApply").addEventListener("click",wiApply);
$("wi").addEventListener("click",e=>{if(e.target.id==="wi")closeWI()});

/* ---------- ログイン ---------- */
$("loginForm").addEventListener("submit",e=>{
  e.preventDefault();const em=$("em").value.trim(),pw=$("pw").value;const er=$("loginErr");er.hidden=true;
  if(!em||!pw){er.textContent="メールアドレスとパスワードを入力してください。";er.hidden=false;return}
  $("loginBtn").disabled=true;$("loginBtn").textContent="ログイン中…";
  fbAuth.signInWithEmailAndPassword(em,pw).catch(x=>{
    const c=x&&x.code;
    er.textContent=c==="auth/network-request-failed"?"ネットワークに接続できません。":c==="auth/too-many-requests"?"試行回数が多すぎます。しばらく待ってから再度お試しください。":"メールアドレスまたはパスワードが違います。";
    er.hidden=false;
  }).finally(()=>{$("loginBtn").disabled=false;$("loginBtn").textContent="ログイン"});
});
$("resetBtn").addEventListener("click",()=>{
  const em=$("em").value.trim(),er=$("loginErr");er.hidden=false;
  if(!em){er.textContent="先にメールアドレスを入力してください。";return}
  fbAuth.sendPasswordResetEmail(em).then(()=>{er.textContent="パスワード再設定のメールを送りました。"}).catch(()=>{er.textContent="メールを送れませんでした。"});
});

/* ---------- 起動 ---------- */
if(!fbAuth)render();
else fbAuth.onAuthStateChanged(async u=>{
  [unsubHorses,unsubMonth,unsubHorse,unsubRep,unsubSent,unsubRepHorse].forEach(f=>{if(f)try{f()}catch(e){}});
  unsubHorses=unsubMonth=unsubHorse=unsubRep=unsubSent=unsubRepHorse=null;
  S.user=u||null;S.view="home";S.horseId=null;S.composeOwner=null;S.panel=false;S.dataErr=null;S.upErr=null;
  S.ym=ymOf(Date.now());S.ymAuto=true;
  if(u){await loadQueue();listenHorses();listenMonth();render();pump()}
  else render();
});
</script>
</body>
</html>
